[shell]

  [shell.panel]
  session_placement = "floating"
  session_position = "center"

  [[shell.session.actions]]
  action = "shutdown"
  countdown_seconds = 0.0
  enabled = true
  shortcut = "1"
  variant = "destructive"

  [[shell.session.actions]]
  action = "reboot"
  countdown_seconds = 0.0
  enabled = true
  shortcut = "2"
  variant = "default"

  [[shell.session.actions]]
  action = "lock"
  countdown_seconds = 0.0
  enabled = true
  shortcut = "3"
  variant = "default"

  [[shell.session.actions]]
  action = "lock_and_suspend"
  countdown_seconds = 0.0
  enabled = true
  shortcut = "4"
  variant = "default"

  [[shell.session.actions]]
  action = "logout"
  command = "hyprshutdown"
  countdown_seconds = 0.0
  enabled = true
  shortcut = "5"
  variant = "default"
